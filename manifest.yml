modules:
  jira:issueContext:
    - key: decision-drift-guard-context
      resource: main
      resolver:
        function: resolver
      render: native
      title: Decision Drift Guard
      label: Decision check
      icon: resource:icons;icon.svg
  jira:adminPage:
    - key: decision-drift-guard-settings
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Decision Drift Guard settings
  jira:globalPage:
    - key: decision-drift-guard-history
      resource: history
      resolver:
        function: resolver
      render: native
      title: Decision drift history
      icon: resource:icons;icon.svg
  jira:workflowValidator:
    - key: decision-drift-guard-close-check
      name: Followed decisions are still current
      description: Stops the transition when this work item follows a Confluence decision that was marked Superseded, Deprecated, Rejected or Abandoned and nobody has checked the work against it.
      function: close-check-fn
  rovo:agent:
    - key: decision-drift-guard-agent
      name: Decision Drift Guard
      description: Checks a Jira work item against the decisions your team recorded in Confluence and quotes the evidence.
      prompt: resource:agent-prompt;agent.md
      conversationStarters:
        - Does this work item conflict with any recorded decision?
        - Which decisions apply to checkout?
        - List our active decisions
      actions:
        - get-decision-context
        - list-decisions
        - request-decision-reopen
  action:
    - key: get-decision-context
      name: Get decision context
      function: get-decision-context-fn
      actionVerb: GET
      description: Returns a Jira work item, a rule-based check against recorded decisions, and every active decision from Confluence (labelled pages, Decision template pages, inline decisions, title matches) with its outcome and Do not and Instead rules.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item key, for example MOBL-12
    - key: list-decisions
      name: List decisions
      function: list-decisions-fn
      actionVerb: GET
      description: Lists decisions recorded in Confluence (labelled pages, Decision template pages, inline decisions, title matches), optionally filtered by a word.
      inputs:
        query:
          title: Filter word
          type: string
          required: false
          description: Optional word to filter decisions, for example checkout
    - key: request-decision-reopen
      name: Request decision reopen
      function: reopen-decision-fn
      actionVerb: CREATE
      description: Posts a reopen request as a comment on a Confluence decision page, linked to the Jira work item. The decision page body is not changed.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The Jira work item that needs the decision changed
        pageId:
          title: Decision page id
          type: string
          required: true
          description: The Confluence page id of the decision (pageId from the decision context)
        reason:
          title: Reason
          type: string
          required: true
          description: Why the decision should be reconsidered
  trigger:
    - key: on-issue-created
      function: on-issue-created-fn
      events:
        - avi:jira:created:issue
    - key: on-issue-updated
      function: on-issue-updated-fn
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
    - key: on-page-updated
      function: on-page-updated-fn
      events:
        - avi:confluence:updated:page
  function:
    - key: resolver
      handler: index.handler
    - key: get-decision-context-fn
      handler: index.getDecisionContext
    - key: list-decisions-fn
      handler: index.listDecisions
    - key: reopen-decision-fn
      handler: index.reopenDecision
    - key: close-check-fn
      handler: index.validateClose
    - key: on-issue-created-fn
      handler: index.onIssueCreated
    - key: on-issue-updated-fn
      handler: index.onIssueUpdated
    - key: on-page-updated-fn
      handler: index.onPageUpdated
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: admin
    path: src/frontend/admin.jsx
  - key: history
    path: src/frontend/history.jsx
  - key: agent-prompt
    path: prompts
  - key: icons
    path: static
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - search:confluence
    - read:confluence-content.all
    - read:confluence-content.summary
    - read:page:confluence
    - write:comment:confluence
    - write:page:confluence
    - write:confluence-content
    - read:space:confluence
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/b2e80cfa-2352-4a1e-90e0-c5ed2ec66634
  compatibility:
    jira:
      required: true
    confluence:
      required: false
